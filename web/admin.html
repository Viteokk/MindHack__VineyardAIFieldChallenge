<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Back-office · VinePlan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2315803D'/%3E%3Cpath d='M10 22V13M16 22V9M22 22v-6' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#F3F5F4;--surface:#FFFFFF;--surface2:#F7F9F8;--ink:#101713;--muted:#5A655F;--faint:#8A948E;--line:#E2E7E4;--hover:#EEF2F0;
  --accent:#15803D;--accent-ink:#FFFFFF;--accent-soft:#E7F4EC;--link:#166534;--danger:#B42318;--danger-soft:#FDECEA;--warn:#B54708;--warn-soft:#FEF0DC;
  --ok:#067647;--ok-soft:#E3F6EA;--blue:#1D4ED8;--blue-soft:#E8EEFD;--shadow:0 1px 2px rgba(16,23,19,.05),0 10px 30px rgba(16,23,19,.07);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0F0D;--surface:#131A16;--surface2:#18211C;--ink:#EDF2EE;--muted:#9BA69F;--faint:#76807A;
  --line:#26302A;--hover:#1C2621;--accent:#22C55E;--accent-ink:#052E14;--accent-soft:#12301E;--link:#4ADE80;--danger:#F97066;--danger-soft:#3A1715;
  --warn:#FDB022;--warn-soft:#3A2A0C;--ok:#47CD89;--ok-soft:#0F2E1D;--blue:#84ADFF;--blue-soft:#172448;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0F0D;--surface:#131A16;--surface2:#18211C;--ink:#EDF2EE;--muted:#9BA69F;--faint:#76807A;--line:#26302A;--hover:#1C2621;
  --accent:#22C55E;--accent-ink:#052E14;--accent-soft:#12301E;--link:#4ADE80;--danger:#F97066;--danger-soft:#3A1715;--warn:#FDB022;--warn-soft:#3A2A0C;
  --ok:#47CD89;--ok-soft:#0F2E1D;--blue:#84ADFF;--blue-soft:#172448;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:30px;line-height:1.15;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:19px;margin:0;letter-spacing:-.01em}
h3{font-size:15px;margin:0}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:.92em}
.num{font-variant-numeric:tabular-nums}
.nowrap{white-space:nowrap}
.muted{color:var(--muted)}
[hidden]{display:none!important}
/* top bar */
.top{position:sticky;top:0;z-index:40;height:64px;display:flex;align-items:center;gap:14px;padding:0 20px;padding-top:env(safe-area-inset-top,0px);background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);font-weight:700;font-size:17px}
.brand:hover{text-decoration:none}
.brand i{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:#fff}
.brand small{font-weight:600;font-size:12px;color:var(--muted);padding:3px 8px;border:1px solid var(--line);border-radius:999px;margin-left:4px}
.demo-chip{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:4px 8px;border-radius:6px}
.grow{flex:1}
.langs{display:flex;gap:2px}
.langs button{border:0;background:none;padding:8px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-width:36px;min-height:36px}
.langs button[aria-pressed="true"]{color:var(--blue)}
.icon-btn{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:10px;border:0;background:none;color:var(--ink);cursor:pointer}
.icon-btn:hover{background:var(--hover)}
.badge-n{position:absolute;top:3px;right:1px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.me{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
.burger{display:none}
/* shell */
.shell{display:flex;align-items:flex-start}
.side{position:sticky;top:64px;flex:none;width:264px;height:calc(100vh - 64px);overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:12px 12px 24px;display:flex;flex-direction:column;gap:2px}
.side .col{align-self:flex-end;margin-bottom:6px}
.side h4{margin:18px 10px 6px;font-size:13px;font-weight:700;color:var(--ink);letter-spacing:.01em}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink);font-weight:600;font-size:15px;min-height:44px}
.nav:hover{background:var(--hover);text-decoration:none}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--link)}
.nav svg{flex:none}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)}
.side .sep{height:1px;background:var(--line);margin:12px 6px}
.side.mini{width:72px}.side.mini .lbl,.side.mini h4,.side.mini .cnt{display:none}.side.mini .nav{justify-content:center;padding:10px}
main{flex:1;min-width:0;padding:28px 32px 64px;max-width:1440px}
/* page parts */
.page-h{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hover);text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.ghost{border-color:transparent;background:none}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.search{position:relative;flex:1 1 320px;max-width:560px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px 0 38px}
.chip-btn{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border:1px dashed var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.chip-btn.on{border-style:solid;border-color:var(--accent);color:var(--link)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.card.pad{padding:24px}
.tbl{overflow-x:auto;border-radius:16px;position:relative}   /* hidden screen-reader labels stay inside the scroll box */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:700;padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
td{padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--hover)}
tbody tr:last-child td{border-bottom:0}
td.cb,th.cb{width:44px;padding-right:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.dots{border:0;background:none;width:36px;height:36px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.dots:hover{background:var(--hover)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:600;border:1px solid var(--line);white-space:nowrap;background:var(--surface)}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--danger)}.pill.off{color:var(--faint)}.pill.info{color:var(--blue)}
.tag{display:inline-block;padding:3px 9px;border-radius:7px;font-size:12.5px;font-weight:600;background:var(--hover);color:var(--ink);margin:2px 4px 2px 0}
.tag.perm{background:var(--blue-soft);color:var(--blue);border-radius:999px}
.roles-cell b{display:block;font-size:13px;margin-top:2px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:14px}
.pager .pg{display:flex;align-items:center;gap:8px}
.pager select{min-height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 10px}
.pager button{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.pager button[disabled]{opacity:.4;cursor:default}
.selbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border-radius:12px;background:var(--accent-soft);color:var(--link);font-weight:600;font-size:14px}
/* popover / menu / modal */
.pop{position:fixed;z-index:80;min-width:220px;max-width:340px;max-height:60vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:6px}
.pop button,.pop label,.pop a{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;background:none;border-radius:8px;text-align:left;cursor:pointer;font-size:14px;color:var(--ink)}
.pop button:hover,.pop label:hover,.pop a:hover{background:var(--hover);text-decoration:none}
.pop .ph{padding:8px 10px 4px;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.veil{position:fixed;inset:0;z-index:90;background:rgba(10,14,12,.45);display:grid;place-items:center;padding:16px}
.modal{width:min(520px,100%);background:var(--surface);border-radius:18px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:100;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow)}
/* forms */
.form-card{padding:28px}
.form-card+.form-card{margin-top:16px}
.form-card .sub{color:var(--muted);margin:4px 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px 20px}
.grid.two{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.f{display:flex;flex-direction:column;gap:7px;font-weight:600;font-size:14px;min-width:0}
.f input,.f select,.f textarea{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-weight:400;width:100%}
.f textarea{padding:10px 12px;min-height:90px}
.f .ph-in{display:flex;gap:8px;align-items:center}
.f .ph-in span{padding:10px 12px;border-radius:10px;background:var(--hover);font-weight:600}
.f .err{color:var(--danger);font-weight:500;font-size:13px}
.f.bad input,.f.bad select{border-color:var(--danger)}
.f .ro{min-height:46px;display:flex;align-items:center;padding:0 12px;border-radius:10px;background:var(--surface2);border:1px dashed var(--line);font-weight:400;color:var(--muted)}
.req{color:var(--danger)}
.form-acts{display:flex;gap:12px;align-items:center;margin-top:22px}
.rolebox{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;grid-column:1/-1}
.rolebox fieldset{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0}
.rolebox legend{font-weight:700;font-size:14px;padding:0 4px}
.rolebox label{display:flex;gap:10px;align-items:flex-start;font-weight:500;padding:6px 0;cursor:pointer}
.rolebox small{display:block;color:var(--muted);font-size:12px;font-weight:400}
/* detail pages */
.d-head{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:22px}
.d-head .back{width:44px;height:44px;border-radius:12px;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.d-head .back:hover{background:var(--hover)}
.d-head .av{width:72px;height:72px;font-size:24px}
.d-head .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.d-head .t .muted{font-size:15px}
.d-head .acts{margin-left:auto;display:flex;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 16px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button[disabled]{opacity:.45;cursor:default}
.tabs button.done{color:var(--ink)}
dl.kv{display:grid;grid-template-columns:minmax(140px,260px) 1fr;gap:0;margin:0}
dl.kv dt{font-weight:700;color:var(--muted);padding:12px 0;border-bottom:1px solid var(--line)}
dl.kv dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line);min-width:0;overflow-wrap:anywhere}
dl.kv dt:last-of-type,dl.kv dd:last-of-type{border-bottom:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.kpi b{display:block;font-size:26px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi span{color:var(--muted);font-size:13.5px}
.two-col{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.two-col.noact{grid-template-columns:minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
details.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 24px}
details.sec summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 0;font-weight:700;font-size:18px}
details.sec summary::-webkit-details-marker{display:none}
details.sec summary::after{content:'';width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-right:4px;transition:transform .15s}
details.sec[open] summary::after{transform:rotate(-135deg)}
details.sec>div{padding-bottom:22px}
details.sec.hl{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chk{display:grid;grid-template-columns:26px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:13px}
.chk .i.pass{background:var(--ok-soft);color:var(--ok)}.chk .i.warn{background:var(--warn-soft);color:var(--warn)}.chk .i.fail{background:var(--danger-soft);color:var(--danger)}.chk .i.info{background:var(--blue-soft);color:var(--blue)}
.chk small{display:block;color:var(--muted)}
/* activity */
.act-panel{position:sticky;top:84px;max-height:calc(100vh - 110px);overflow:auto;padding:20px}
.act-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.ev{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.ev:last-child{border-bottom:0}
.ev .ic{color:var(--muted);padding-top:2px}
.ev .who{font-weight:700}
.ev .what{font-weight:600;color:var(--muted);margin-left:6px}
.ev time{display:block;font-size:13px;color:var(--muted)}
.ev .src{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--blue);margin-left:6px}
.ev .fld{margin-top:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.ev .chg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.ev .b4{background:var(--danger-soft);color:var(--danger);padding:5px 10px;border-radius:7px;font-weight:600}
.ev .af{background:var(--ok-soft);color:var(--ok);padding:5px 10px;border-radius:7px;font-weight:600}
.ev .obj{margin-top:6px;font-weight:600}
.ev .ev-o{display:block;margin-top:8px;font-weight:700;color:var(--link)}
.ev span.ev-o{color:var(--ink)}
.ev .ev-d{margin-top:4px}
.ev .ev-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px;color:var(--muted)}
.ev .ev-m span{color:var(--faint)}
.flt{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:4px}
.switch{display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;border:0;background:none;padding:6px}
.switch i{width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background .15s}
.switch i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .15s}
.switch[aria-checked="true"] i{background:var(--blue)}
.switch[aria-checked="true"] i::after{transform:translateX(18px)}
.meta-row{display:flex;gap:28px;flex-wrap:wrap;margin:-6px 0 18px;color:var(--muted)}
.meta-row b{color:var(--ink)}
.stage-pill{display:inline-block;padding:6px 14px;border-radius:999px;background:var(--muted);color:var(--surface);font-weight:600;font-size:14px}
/* charts */
.chart{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:minmax(120px,220px) 1fr auto;gap:12px;align-items:center;font-size:14px}
.bar .tr{height:14px;border-radius:7px;background:var(--hover);overflow:hidden;display:flex}
.bar .tr i{display:block;height:100%}
.bar .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;min-width:60px}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:13px;margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
.gate{max-width:520px;margin:12vh auto;padding:32px;text-align:center}
.gate p{color:var(--muted)}
.foot{margin-top:40px;color:var(--muted);font-size:12.5px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.skip{position:fixed;left:12px;top:-60px;z-index:200;background:var(--surface);color:var(--ink);border:2px solid var(--blue);font-weight:700;padding:10px 14px;border-radius:10px;transition:top .15s}.skip:focus{top:12px}
@media (max-width:1100px){.two-col{grid-template-columns:minmax(0,1fr)}.act-panel{position:static;max-height:none}}
@media (max-width:900px){
  .burger{display:inline-grid}
  .side{position:fixed;left:0;top:64px;bottom:0;height:auto;z-index:60;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow)}
  .side.open{transform:none}.side .col{display:none}
  main{padding:20px 16px 56px}
  .me .nm,.brand small{display:none}
  .top{padding:0 12px;gap:6px}
  dl.kv{grid-template-columns:1fr}dl.kv dt{border-bottom:0;padding-bottom:0}
  .bar{grid-template-columns:1fr 70px}.bar .lb{grid-column:1/-1}
  h1{font-size:25px}
}
@media (max-width:520px){.demo-chip,.brand .bn{display:none}.langs button{min-width:30px;padding:6px}.top .icon-btn{width:36px}}
</style>
</head>
<body>
<button class="skip" type="button" data-act="skip">Salt la conținut</button>
<header class="top">
  <button class="icon-btn burger" type="button" data-act="side" aria-label="Meniu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="brand" href="#/cereri" aria-label="VinePlan · Back-office"><i><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M7 18V11M12 18V7M17 18v-5"/></svg></i><span class="bn">VinePlan</span><small>Back-office</small></a>

function activityOf(c) {            // an application: its history + back-office actions + the inspector's portal actions on its block
  const a = (c.activitate || []).map(e => ({...e, src: 'demo'}));
  const bo = BOACT.filter(e => e.obj === c.id);
  const po = portalAct().filter(e => e.obj && (e.obj === c.vineyard_id || (c.parcele || []).includes(e.obj))).map(portalEv);

function activityOfUser(u) {
  const out = [];
  for (const c of coll('cereri')) for (const e of c.activitate || []) if (e.user === u.id) out.push({...e, src: 'demo', obj: c.id});

function openPop(anchor, html, onClick) {

  document.body.appendChild(v);

}

    if (docs) return openPop(docs, `<div class="ph">${t('Dosarul cererii')}</div>${(c.documente || []).map(([n, st]) => `<button type="button" data-a="doc">${st === 'depus' ? IC.clip : IC.note}${esc(t(n))}${st !== 'depus' ? ` · <b style="color:var(--${st === 'lipsă' ? 'danger' : 'warn'})">${esc(t(st))}</b>` : ''}</button>`).join('')}<a href="app.html#${esc(c.vineyard_id)}">${IC.clip}${t('Proces-verbal de control')} · ${esc(c.vineyard_id)}</a>`);
    const ac = ev.target.closest('[data-pop="actions"]');
    if (ac) return openPop(ac, [['assign', 'Alocă inspector'], ['next', 'Treci la etapa următoare'], ['sum', 'Setează suma eligibilă'], ['decide', 'Decizia'], ['note', 'Adaugă notă']].map(([a, l]) => `<button type="button" data-a="${a}">${t(l)}</button>`).join(''), (e2) => {
      const a = e2.target.closest('[data-a]')?.dataset.a; if (!a) return; closePop(); cerAction(c, a);
    });
  };
  logView(c);
}
function logView(c) { const last = BOACT.filter(e => e.obj === c.id && e.action === 'vizualizare' && e.user === ME().id).pop(); if (!last || Date.now() - new Date(last.ts).getTime() > 10 * 60e3) logAct(c.id, {action: 'vizualizare', what: 'Dosarul cererii'}); }
function cerAction(c0, a) {
  const c = {...c0, activitate: c0.activitate}; const i = ETAPE().indexOf(c.etapa);
  const done = (msg) => { put('cereri', c); toast(msg || t('Salvat')); viewCerere(c.id); };
  if (a === 'assign') return modal(t('Alocă inspector'), `<label class="f"><span>${t('Inspector')}</span><select id="m-insp">${inspectors().filter(u => u.statut === 'Activ').map(u => `<option value="${u.id}" ${u.id === c.inspector ? 'selected' : ''}>${esc(u.prenume)} ${esc(u.nume)} · ${esc(oname(u.organizatie))}</option>`).join('')}</select></label>`, v => {
    const n = $('#m-insp', v).value; if (n === c.inspector) return; logAct(c.id, {action: 'modificare', field: 'Inspector alocat', before: c.inspector || '—', after: n}); c.inspector = n; done(); });
  if (a === 'next') {
    if (i >= ETAPE().length - 1) return toast(t('Cererea e deja la ultima etapă'));
    const nx = ETAPE()[i + 1];
    if (nx === 'Control pe teren' && !c.inspector) { toast(t('Pentru control pe teren trebuie alocat un inspector')); return cerAction(c0, 'assign'); }
    if (nx === 'Decizie' && c.suma_eligibila_lei == null) { toast(t('Setați întâi suma eligibilă')); return cerAction(c0, 'sum'); }
    if (nx === 'Evaluare' && !c.rezultat_control) { const blk = CMP?.blocks?.find(x => x.vineyard_id === c.vineyard_id); const res = {neconform: 'neconform', verificare: 'de verificat', conform: 'conform'}[blk?.status] || 'conform';
      logAct(c.id, {action: 'modificare', field: 'Rezultat control', before: '—', after: res}); c.rezultat_control = res; }
    logAct(c.id, {action: 'modificare', field: 'Etapa', before: c.etapa, after: nx}); c.etapa = nx; return done();
  }
  if (a === 'sum') { const blk = CMP?.blocks?.find(x => x.vineyard_id === c.vineyard_id), sug = blk?.eligibility?.eligible_lei;
    return modal(t('Setează suma eligibilă'), `<label class="f"><span>${t('Suma eligibilă (lei)')}</span><input id="m-sum" type="number" min="0" step="100" value="${c.suma_eligibila_lei ?? sug ?? ''}"></label>${sug != null ? `<p class="muted" style="margin:0">${t('Sugestie din măsurători: {v} lei', {v: fmt(sug)})}</p>` : ''}`, v => {
      const n = $('#m-sum', v).value; if (n === '' || +n < 0) return false; logAct(c.id, {action: 'modificare', field: 'Suma eligibilă (lei)', before: c.suma_eligibila_lei == null ? '—' : fmt(c.suma_eligibila_lei), after: fmt(+n)}); c.suma_eligibila_lei = +n; done(); }); }
  if (a === 'decide') return modal(t('Decizia'), `<label class="f"><span>${t('Decizia')}</span><select id="m-dec">${['Aprobată', 'Eligibilă parțial', 'Respinsă (neeligibilă)'].map(s => `<option value="${s}" ${s === c.decizie ? 'selected' : ''}>${t(s)}</option>`).join('')}</select></label>`, v => {
    const n = $('#m-dec', v).value; logAct(c.id, {action: 'modificare', field: 'Decizie', before: c.decizie || '—', after: n}); c.decizie = n; done(); });
  if (a === 'note') return modal(t('Adaugă notă'), `<label class="f"><span>${t('Notă')}</span><textarea id="m-note" rows="4"></textarea></label>`, v => {
    const n = $('#m-note', v).value.trim(); if (!n) return false; logAct(c.id, {action: 'nota', text: n}); done(); });
}

/* ============ reports ============ */
function bars(items, max, color) {
  max = max || Math.max(1, ...items.map(x => x[1]));
  return `<div class="chart">${items.map(([l, v, c, lab]) => `<div class="bar"><span class="lb">${esc(l)}</span><span class="tr"><i style="width:${Math.max(0, v) / max * 100}%;background:${c || color || 'var(--accent)'}"></i></span><span class="v">${lab ?? fmt(v)}</span></div>`).join('')}</div>`;
}
let RT = 'cereri', RV = 'panou';

  let panel = '', table = [], title = '';

      <div class="kpi"><b>${fmt(req)}</b><span>${t('lei ceruți')}</span></div><div class="kpi"><b>${fmt(el)}</b><span>${t('lei eligibili')}</span></div></div>
      <section class="card pad"><h2 style="margin-bottom:14px">${t(title)}</h2>${bars(ETAPE().map(s => [t(s), C.filter(c => c.etapa === s).length, s === 'Control pe teren' || s === 'Evaluare' ? 'var(--warn)' : s === 'Decizie' || s === 'Plată' ? 'var(--ok)' : 'var(--blue)']))}</section>`;
    table = [[t('Nr. cererii'), t('Beneficiar'), t('Bloc'), t('Etapa'), t('Inspector'), t('Suma cerută (lei)'), t('Suma eligibilă (lei)')], ...C.map(c => [c.id, bname(c.beneficiar), c.vineyard_id, t(c.etapa), uname(c.inspector) || '—', c.suma_ceruta_lei, c.suma_eligibila_lei ?? ''])];
  } else if (RT === 'control') {
    const ins = inspectors().map(u => { const mine = C.filter(c => c.inspector === u.id); return {u, n: mine.length, done: mine.filter(c => c.rezultat_control).length, nec: mine.filter(c => c.rezultat_control === 'neconform').length, acts: activityOfUser(u).filter(e => !['conectare', 'deconectare'].includes(e.action)).length}; }).filter(x => x.n || x.acts);
    title = 'Activitatea inspectorilor';
    const s = CMP?.summary?.status || {};
    panel = `<div class="kpis"><div class="kpi"><b>${C.filter(c => c.etapa === 'Control pe teren').length}</b><span>${t('cereri așteaptă controlul pe teren')}</span></div><div class="kpi"><b>${s.neconform ?? '—'}</b><span>${t('neconform')} · ${t('Bloc')}</span></div>
      <div class="kpi"><b>${s.verificare ?? '—'}</b><span>${t('de verificat')} · ${t('Bloc')}</span></div><div class="kpi"><b>${s.conform ?? '—'}</b><span>${t('conform')} · ${t('Bloc')}</span></div></div>
      <section class="card pad"><h2 style="margin-bottom:14px">${t(title)}</h2>${bars(ins.map(x => [`${x.u.prenume} ${x.u.nume}`, x.n, 'var(--blue)', `${x.n} ${t('alocate')} · ${x.done} ✓`]))}
      <div class="legend"><span><i style="background:var(--blue)"></i>${t('alocate')}</span><span>✓ ${t('controale finalizate')}</span></div></section>`;
    table = [[t('Inspector'), t('Organizație'), t('alocate'), t('controale finalizate'), t('neconform'), t('acțiuni înregistrate')], ...ins.map(x => [`${x.u.prenume} ${x.u.nume}`, oname(x.u.organizatie), x.n, x.done, x.nec, x.acts])];
  } else if (RT === 'beneficiari') {
    title = 'Beneficiari după conformitate';
    const k = ['neconform', 'verificare', 'conform', 'sub_prag', 'fara_bloc'];
    panel = `<div class="kpis"><div class="kpi"><b>${BEN.length}</b><span>${t('Beneficiari')}</span></div>${['SRL', 'SA', 'GȚ', 'ÎI'].map(f => `<div class="kpi"><b>${BEN.filter(b => b.forma === f).length}</b><span>${f}</span></div>`).join('')}</div>
      <section class="card pad"><h2 style="margin-bottom:14px">${t(title)}</h2>${bars(k.map(x => [t(CONF[x][0]), BEN.filter(b => b.conformitate === x).length, {bad: 'var(--danger)', warn: 'var(--warn)', ok: 'var(--ok)', off: 'var(--faint)'}[CONF[x][1]]]))}</section>`;
    table = [[t('Denumire'), t('Forma'), t('Suprafață declarată'), t('Suprafață măsurată'), t('Parcele'), t('Conformitate')], ...BEN.map(b => [b.denumire, b.forma, b.suprafata_declarata_ha, b.suprafata_masurata_ha, (b.parcele || []).length, t(CONF[b.conformitate]?.[0] || b.conformitate)])];
  } else if (RT === 'registru') {
    const P = BEN.flatMap(b => (b.parcele || []).map(p => ({...p, ben: b.denumire}))), dec = P.reduce((a, p) => a + (p.suprafata_declarata_ha || 0), 0), mea = P.reduce((a, p) => a + (p.suprafata_masurata_ha || 0), 0);

    panel = `<div class="kpis"><div class="kpi"><b>${P.length}</b><span>${t('Parcele')}</span></div><div class="kpi"><b>${fmt(dec, 2)} ha</b><span>${t('Suprafață declarată')}</span></div><div class="kpi"><b>${fmt(mea, 2)} ha</b><span>${t('Suprafață măsurată')}</span></div>

      <section class="card pad"><h2 style="margin-bottom:14px">${t(title)}</h2>${bars(S.map(p => [`${p.cad_nr} · ${p.ben}`, Math.abs(p.diferenta_pct), Math.abs(p.diferenta_pct) > 20 ? 'var(--danger)' : Math.abs(p.diferenta_pct) > 10 ? 'var(--warn)' : 'var(--ok)', (p.diferenta_pct > 0 ? '+' : '') + fmt(p.diferenta_pct, 1) + ' %']), 100)}</section>`;

  } else {

      <section class="card pad"><h2 style="margin-bottom:14px">${t(title)}</h2>${bars(per, 0, 'var(--blue)')}</section>`;
    table = [[t('Organizație'), t('Utilizatori')], ...coll('organizatii').map(o => [o.titlu, U.filter(u => u.organizatie === o.id).length]).filter(r => r[1])];
  }
  const tbl = `<section class="card"><div class="tbl" tabindex="0"><table><thead><tr>${table[0].map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${table.slice(1).map(r => `<tr style="cursor:default">${r.map(v => `<td class="${typeof v === 'number' ? 'num' : ''}">${typeof v === 'number' ? fmt(v, Number.isInteger(v) ? 0 : 2) : esc(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></section>`;
  $('#main').innerHTML = `<div class="page-h"><h1>${t('Rapoarte')}</h1><button class="btn" type="button" data-act="rcsv">${IC.down}${t('Export CSV')}</button></div>
    <div class="tabs" role="tablist">${TABS.map(([k, l]) => `<button type="button" role="tab" aria-selected="${k === RT}" data-rt="${k}">${t(l)}</button>`).join('')}</div>
    <h2 style="font-size:26px;margin:4px 0 14px">${t(TABS.find(x => x[0] === RT)[1])}</h2>
    <label class="f" style="max-width:320px;margin-bottom:16px"><span>${t('Panou')}</span><select id="rv"><option value="panou" ${RV === 'panou' ? 'selected' : ''}>${t('Panou de indicatori')}</option><option value="tabel" ${RV === 'tabel' ? 'selected' : ''}>${t('Tabel detaliat')}</option></select></label>
    ${RV === 'panou' ? panel : tbl}<p class="foot">${esc(B.about)}</p>`;
  $('#rv').addEventListener('change', e => { RV = e.target.value; viewRap(RT); });
  $('#main').onclick = e => { const b = e.target.closest('[data-rt]'); if (b) location.hash = '#rapoarte/' + b.dataset.rt; if (e.target.closest('[data-act="rcsv"]')) download(`raport_${RT}.csv`, csv(table)); };
}

/* ============ roles, activity ============ */
function notFound() { $('#main').innerHTML = `<div class="card pad"><h2>404</h2><p class="muted">${t('Nicio înregistrare.')}</p><a class="btn" href="#/cereri">${t('Cereri de subvenție')}</a></div>`; }

/* ============ shell: nav, bell, language, routing ============ */
function renderShell() {
  const me = ME();
  $('#me').innerHTML = `<span class="av" style="background:${colorOf(me.email)}">${esc(initials(me.prenume + ' ' + me.nume))}</span><span class="nm">${esc(me.prenume)} ${esc(me.nume)}</span>`;
  const n = coll('cereri').filter(c => c.etapa === 'Control pe teren').length;
  const item = (k, l, cnt) => `<a class="nav" href="#/${k}" data-nav="${k}">${nicon(k)}<span class="lbl">${t(l)}</span>${cnt ? `<span class="cnt">${cnt}</span>` : ''}</a>`;
  $('#side').innerHTML = `<button class="icon-btn col" type="button" data-act="mini" aria-label="${t('Restrânge meniul')}" title="${t('Restrânge meniul')}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4v16M20 12H9M13 7l-5 5 5 5"/></svg></button>
    ${item('cereri', 'Cereri de subvenție', n)}${item('beneficiari', 'Beneficiari')}${item('rapoarte', 'Rapoarte')}
    <h4>${t('Administrare')}</h4>${item('organizatii', 'Organizații')}${item('utilizatori', 'Utilizatori platformei')}${item('roluri', 'Roluri și permisiuni')}
    <div class="sep"></div><a class="nav" href="app.html">${nicon('harta')}<span class="lbl">${t('Harta (portal)')}</span></a><a class="nav" href="index.html">${nicon('start')}<span class="lbl">${t('Pagina principală')}</span></a>
    <button class="nav" type="button" data-act="reset" style="border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;font-size:13px">${t('Resetează datele demo')}</button>`;
  $('#side').classList.toggle('mini', !!store.get('bo_mini', false));
  $$('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === LANG));
  $('#demo-chip').textContent = t('Date demonstrative');
  const notes = bellItems(), cnt = notes.reduce((a, x) => a + x[0], 0);
  $('#bell-n').hidden = !cnt; $('#bell-n').textContent = cnt > 99 ? '99+' : cnt;
  document.documentElement.lang = LANG;
}
function bellItems() {
  const C = coll('cereri'), U = coll('utilizatori'), seen = store.get('bo_seen', '');
  return [[C.filter(c => c.etapa === 'Control pe teren').length, 'cereri așteaptă controlul pe teren', '#cereri'], [C.filter(c => ['Depunere', 'Verificare administrativă'].includes(c.etapa)).length, 'cereri noi de verificat', '#cereri'],
    [U.filter(u => u.statut === 'În așteptare').length, 'conturi în așteptare', '#utilizatori'],
    [portalAct().filter(e => e.ts > seen).length, 'acțiuni noi ale inspectorilor în portal', (() => { const last = portalAct().filter(e => e.ts > seen).pop(), u = last && U.find(x => x.email === last.email); return u ? `#utilizatori/${u.id}/activitate` : '#utilizatori'; })()]].filter(x => x[0]);
}
function route() {
  closePop(); $$('.veil').forEach(v => v.remove()); $('#side').classList.remove('open');
  if (!SESSION || SESSION.role !== 'sysadmin') return gate();
  const [mod, id, sub] = decodeURIComponent(location.hash.replace(/^#\/?/, '') || 'cereri').split('/');
  renderShell();
  roleIndex();
  $$('[data-nav]').forEach(a => a.dataset.nav === (mod === 'permisiuni' ? 'roluri' : mod) ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  if (mod === 'rapoarte') viewRap(id);
  else if (mod === 'activitate') { location.replace('#utilizatori'); return; }
  else if (LISTS[mod] && !id) viewList(mod);
  else if (FORMS[mod] && (id === 'nou' || sub === 'editare')) viewForm(mod, id);
  else if (mod === 'utilizatori') { viewUser(id, sub); if (sub === 'activitate') { store.set('bo_seen', nowIso()); renderShell(); } }
  else if (mod === 'beneficiari') viewBen(id);
  else if (mod === 'cereri') viewCerere(id);
  else if (mod === 'organizatii') viewForm(mod, id);
  else notFound();
  window.scrollTo(0, 0);
  document.title = `${t({cereri: 'Cereri de subvenție', beneficiari: 'Beneficiari', rapoarte: 'Rapoarte', organizatii: 'Organizații', utilizatori: 'Utilizatori platformei', roluri: 'Roluri și permisiuni', permisiuni: 'Roluri și permisiuni'}[mod] || 'Back-office')} · VinePlan`;
}
function gate() {
  $('#side').hidden = true; $('#me').innerHTML = '';
  $('#main').innerHTML = `<div class="card gate"><h1 style="font-size:26px">${t('Acces restricționat')}</h1><p>${t('Back-office-ul este disponibil pentru rolul Administrator de sistem.')}</p><a class="btn primary" href="login.html#backoffice">${t('Autentificare')}</a></div>`;
}
document.addEventListener('click', e => {
  const l = e.target.closest('[data-lang]'); if (l) { LANG = l.dataset.lang; store.set('lang', LANG); return route(); }
  if (e.target.closest('[data-act="skip"]')) return $('#main').focus();
  if (e.target.closest('[data-act="side"]')) return $('#side').classList.toggle('open');
  if (e.target.closest('[data-act="mini"]')) { store.set('bo_mini', !store.get('bo_mini', false)); return $('#side').classList.toggle('mini'); }
  if (e.target.closest('[data-act="logout"]')) { try { localStorage.removeItem('fpm.session'); localStorage.removeItem('fpm.role'); } catch (x) {} location.href = 'index.html'; return; }
  if (e.target.closest('[data-act="reset"]')) { for (const k of Object.keys(OV)) OV[k] = {}; store.set('bo', OV); BOACT = []; store.set('bo_activity', []); toast(t('Datele demo au fost resetate')); return route(); }
  const bell = e.target.closest('[data-act="bell"]');
  if (bell) { const it = bellItems(); bell.setAttribute('data-pop', '1');
    return openPop(bell, `<div class="ph">${t('Notificări')}</div>${it.map(([n, l, h]) => `<a href="${h.replace(/^#\/?/, '#/')}"><b class="num" style="min-width:24px">${n}</b>${t(l)}</a>`).join('') || `<p class="muted" style="padding:8px 10px;margin:0">${t('Nicio notificare.')}</p>`}`); }
});
window.addEventListener('hashchange', route);
window.addEventListener('storage', e => { if (e.key === 'fpm.activity' && /^#\/?(cereri\/|utilizatori\/)/.test(location.hash)) route(); });   // the portal logged an action in another tab
Promise.all([fetch('data/backoffice.json').then(r => r.json()), fetch('data/compliance.json').then(r => r.ok ? r.json() : null).catch(() => null)]).then(([b, c]) => {
  B = b; CMP = c; roleIndex(); route();
}).catch(err => { $('#main').innerHTML = `<div class="card pad"><h2>Eroare</h2><p class="muted">${esc(err.message)}</p></div>`; });
</script>
